# For the host's own nginx (not the container): /etc/nginx/sites-available/etherdisk.conf, linked
# into sites-enabled. Forwards etherdisk.app to the Etherdisk containers on 127.0.0.1:8880
# (HTTP_PORT in deploy/.env, with behind-proxy.yml in COMPOSE_FILE). See deploy/README.md.
#
# Certificates: certbot on the host (`sudo certbot certonly --webroot -w /var/www/certbot
# -d etherdisk.app -d www.etherdisk.app`); renewal is set up by the certbot package.
#
# If this nginx logs client IPs in its own access_log, the Etherdisk privacy policy needs
# it switched off for these server blocks (done below with the noip format).

log_format etherdisk_noip '[$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name etherdisk.app www.etherdisk.app;
    access_log /var/log/nginx/etherdisk.access.log etherdisk_noip;
    error_log /var/log/nginx/etherdisk.error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://etherdisk.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.etherdisk.app;
    access_log /var/log/nginx/etherdisk.access.log etherdisk_noip;
    error_log /var/log/nginx/etherdisk.error.log crit;
    ssl_certificate     /etc/letsencrypt/live/etherdisk.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etherdisk.app/privkey.pem;
    return 301 https://etherdisk.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name etherdisk.app;
    access_log /var/log/nginx/etherdisk.access.log etherdisk_noip;
    error_log /var/log/nginx/etherdisk.error.log crit;

    ssl_certificate     /etc/letsencrypt/live/etherdisk.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etherdisk.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append: the client's own X-Forwarded-For must not reach the server.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads and downloads instead of buffering them.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
