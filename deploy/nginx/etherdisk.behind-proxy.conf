# etherdisk.app behind the host's own nginx, which owns ports 80/443 and TLS (see deploy/README.md,
# "Ports 80 and 443 are taken"). This one gets plain HTTP from it on HTTP_PORT and routes the app and the API.

# No client IP addresses in logs (see the privacy policy).
log_format noip '[$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log noip;
    error_log /var/log/nginx/error.log crit;

    # The client address comes from the host nginx's X-Forwarded-For. Trusted only from local and
    # Docker networks: publish HTTP_PORT on 127.0.0.1, never on a public interface.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Uploads arrive in parts of 8 encrypted 1 MiB chunks.
    client_max_body_size 16m;

    # Docker's DNS, looked up per request: a restarted container gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://server:8787;
    set $app http://web:3000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append: the server trusts the first address for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Stream uploads and downloads (ciphertext ranges, ZIPs) instead of buffering them.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
