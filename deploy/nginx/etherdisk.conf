# etherdisk.app behind nginx: the app at /, the API at /api/ (same origin, so the site needs
# no CORS; the desktop app's origins are allowed by the server's CORS_ORIGINS).
# Certificates from Let's Encrypt (see deploy/README.md).

# No client IP addresses in logs (see the privacy policy). Set in every server block: a
# server-level access_log replaces the http-level one with IPs from the default nginx.conf.
log_format noip '[$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name etherdisk.app www.etherdisk.app;
    access_log /var/log/nginx/access.log noip;
    error_log /var/log/nginx/error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://etherdisk.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.etherdisk.app;
    access_log /var/log/nginx/access.log noip;
    error_log /var/log/nginx/error.log crit;
    ssl_certificate     /etc/letsencrypt/live/etherdisk.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etherdisk.app/privkey.pem;
    return 301 https://etherdisk.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name etherdisk.app;
    access_log /var/log/nginx/access.log noip;
    error_log /var/log/nginx/error.log crit;

    ssl_certificate     /etc/letsencrypt/live/etherdisk.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etherdisk.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Uploads arrive in parts of 8 encrypted 1 MiB chunks.
    client_max_body_size 16m;

    # Docker's DNS, looked up per request: a restarted container gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://server:8787;
    set $app http://web:3000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append: the server trusts the first address for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads and downloads (ciphertext ranges, ZIPs) instead of buffering them.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
