name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (crypto, server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build --sizes
      - name: Tests
        run: forge test -vvv

  contract-analysis:
    name: Contract analysis (Slither, Aderyn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Static analysis of our contracts (libraries, tests and scripts are skipped).
      # High-severity findings fail the build; the rest is in the log and the report.
      - name: Slither
        run: |
          pip install slither-analyzer==0.11.6
          slither . --filter-paths "lib/|test/|script/" --fail-high
      - name: Aderyn
        run: |
          npm install -g @cyfrin/aderyn@0.6.8
          aderyn . --src src --output aderyn-report.md
          cat aderyn-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: contracts/aderyn-report.md
          if-no-files-found: ignore

  docker:
    name: Docker images and nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server image
        run: docker build -f deploy/server.Dockerfile -t etherdisk-server .
      - name: Web image
        run: >
          docker build -f deploy/web.Dockerfile -t etherdisk-web
          --build-arg NEXT_PUBLIC_CHAIN_ID=1
          --build-arg NEXT_PUBLIC_API_URL=https://etherdisk.app
          --build-arg NEXT_PUBLIC_RPC_URL=https://ethereum-rpc.publicnode.com
          --build-arg NEXT_PUBLIC_CONTRACT_ADDRESS=0x0000000000000000000000000000000000000001 .
      - name: nginx config
        run: |
          mkdir -p /tmp/le/live/etherdisk.app
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=etherdisk.app             -keyout /tmp/le/live/etherdisk.app/privkey.pem -out /tmp/le/live/etherdisk.app/fullchain.pem
          for conf in etherdisk.conf etherdisk.behind-proxy.conf host-etherdisk.conf; do
            docker run --rm -v "$PWD/deploy/nginx/$conf:/etc/nginx/conf.d/default.conf:ro"               -v /tmp/le:/etc/letsencrypt:ro nginx:1.27-alpine nginx -t
          done
      - name: Compose files
        working-directory: deploy
        run: |
          touch server.env
          docker compose config --quiet
          COMPOSE_FILE=docker-compose.yml:behind-proxy.yml docker compose config | tee /tmp/compose.txt
          grep -Eq 'published: "?8880"?' /tmp/compose.txt && ! grep -q 'target: 443' /tmp/compose.txt
      - name: Containers start and answer
        run: |
          docker run -d --name web -p 3000:3000 etherdisk-web
          docker run -d --name server -p 8787:8787             -e RPC_URL=https://ethereum-rpc.publicnode.com -e CHAIN_ID=1             -e CONTRACT_ADDRESS=0x0000000000000000000000000000000000000001 -e START_BLOCK=0             -e DATABASE_URL=sqlite:///tmp/etherdisk.db -e DATA_DIR=/tmp/blobs etherdisk-server
          for i in $(seq 30); do curl -sf localhost:3000/ >/dev/null && curl -sf localhost:8787/api/ideas >/dev/null && break; sleep 2; done
          curl -sf localhost:3000/ | grep -q Etherdisk
          curl -sf -o /dev/null localhost:3000/sw.js
          curl -sf -o /dev/null localhost:3000/crypto/etherdisk_crypto_wasm_bg.wasm
          curl -sf localhost:8787/api/ideas
      - name: nginx behind a host proxy routes the app and the API
        run: |
          docker network create ed && docker network connect ed web && docker network connect ed server
          docker run -d --name nginx --network ed -p 127.0.0.1:8880:80             -v "$PWD/deploy/nginx/etherdisk.behind-proxy.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
          for i in $(seq 15); do curl -sf localhost:8880/ >/dev/null && break; sleep 1; done
          curl -sf -H 'X-Forwarded-For: 203.0.113.7' localhost:8880/ | grep -q Etherdisk
          curl -sf localhost:8880/api/ideas
      - name: Container logs
        if: failure()
        run: docker logs web; docker logs server; docker logs nginx || true

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8787
      NEXT_PUBLIC_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pinned: wasm-pack moved to the wasm-bindgen org and "latest" can resolve to 0.9.1.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build WASM
        run: npm run wasm
      - name: Lint
        run: npx eslint src
      - name: Types
        run: npx next typegen && npx tsc --noEmit
      - name: Build
        run: npx next build

  desktop:
    name: Desktop app (Windows installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    # The pages built into the app: the mainnet settings of desktop/.env.example.
    env:
      NEXT_PUBLIC_API_URL: https://etherdisk.app
      NEXT_PUBLIC_SITE_URL: https://etherdisk.app
      NEXT_PUBLIC_CHAIN_ID: "1"
      NEXT_PUBLIC_CONTRACT_ADDRESS: "0x15B87e1e71B48919CfD6fd23089642A1BA48aBf0"
      NEXT_PUBLIC_RPC_URL: https://ethereum-rpc.publicnode.com,https://mainnet.gateway.tenderly.co
      # Not a secret (the site ships it too): a repository variable, so forks build without it.
      NEXT_PUBLIC_WC_PROJECT_ID: ${{ vars.WC_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      # Pinned: wasm-pack moved to the wasm-bindgen org and "latest" can resolve to 0.9.1.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci --prefix ../web && npm ci
      - name: Build the pages (static export)
        run: npm run web
      - name: Lint
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: desktop/src-tauri
        run: cargo test
      - name: Installer
        run: npx tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":""}}'
      - uses: actions/upload-artifact@v4
        with:
          name: etherdisk-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [rust, contracts, web]
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8788
      NEXT_PUBLIC_RPC_URL: http://127.0.0.1:8545
      NEXT_PUBLIC_CONTRACT_ADDRESS: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      # Pinned: wasm-pack moved to the wasm-bindgen org and "latest" can resolve to 0.9.1.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build server
        working-directory: .
        run: cargo build -p etherdisk-server
      - name: Build app (test env)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
