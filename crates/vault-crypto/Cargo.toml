[package]
name = "vault-crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
unicode-normalization = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[lib]
doctest = false
