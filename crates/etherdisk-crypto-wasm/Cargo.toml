[package]
name = "etherdisk-crypto-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
etherdisk-crypto = { path = "../etherdisk-crypto" }
wasm-bindgen = "0.2"
# Browser randomness (crypto.getRandomValues)
getrandom = { version = "0.2", features = ["js"] }
