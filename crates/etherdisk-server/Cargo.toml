[package]
name = "etherdisk-server"
version = "0.1.0"
edition = "2021"

[dependencies]
etherdisk-crypto = { path = "../etherdisk-crypto" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
futures-util = "0.3"
bytes = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
alloy = { version = "2", features = ["contract", "provider-http", "rpc-client", "rpc-types"] }
siwe = "0.6"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
getrandom = "0.2"
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
fs4 = "1"

[dev-dependencies]
alloy = { version = "2", features = ["signer-local"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
